services:
  frontend:
    image: ${IMAGE:-ghcr.io/OWNER/cpos-frontend:latest}
    container_name: cpos-frontend
    restart: unless-stopped
    # Faqat localhost'ga bog'lanadi — tashqi dunyoga host nginx (reverse proxy) chiqaradi
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
