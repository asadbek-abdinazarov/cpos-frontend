name: Build & Deploy (Docker → Ubuntu 22.04)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name (lowercase)
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Serverdagi compose fayli repodagidan ajralib qolmasligi uchun
      # har deployda ustidan yoziladi.
      - name: Sync docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'docker-compose.yml'
          target: '/opt/cpos-frontend'

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF,APP_PORT_TARGET
          script: |
            set -e
            cd /opt/cpos-frontend

            # GHCR login faqat token berilgan bo'lsa. Image public bo'lsa
            # login umuman kerak emas.
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "GHCR_TOKEN yo'q — login o'tkazib yuborildi (public image)."
            fi

            # .env dagi IMAGE ni shu deploy uchun aniq SHA tegiga yangilaymiz
            if grep -q '^IMAGE=' .env; then
              sed -i "s#^IMAGE=.*#IMAGE=${IMAGE_REF}#" .env
            else
              echo "IMAGE=${IMAGE_REF}" >> .env
            fi

            # 8080 backend'niki — frontend u yerda tura olmaydi.
            # Eski .env da qolgan bo'lsa, ${APP_PORT_TARGET} ga o'tkazamiz.
            if grep -qE '^APP_PORT=8080$' .env; then
              echo "APP_PORT=8080 topildi (backend porti) — ${APP_PORT_TARGET} ga o'zgartirilmoqda."
              sed -i "s#^APP_PORT=.*#APP_PORT=${APP_PORT_TARGET}#" .env
            elif ! grep -q '^APP_PORT=' .env; then
              echo "APP_PORT=${APP_PORT_TARGET}" >> .env
            fi

            # Agar pull muvaffaqiyatsiz bo'lsa, serverdagi eski/buzuq login
            # sabab bo'lishi mumkin — logout qilib anonim urinib ko'ramiz.
            if ! docker compose pull; then
              echo "Pull xato berdi — logout qilib qayta urinilmoqda..."
              docker logout ghcr.io || true
              docker compose pull
            fi

            # Eski konteynerni to'liq to'xtatamiz, aks holda port band qolib
            # yangisi ko'tarila olmaydi.
            # DIQQAT: --remove-orphans ISHLATILMAYDI. U shu compose faylida
            # sanalmagan konteynerlarni o'chiradi — jumladan backend (cpos-app).
            docker compose down || true
            docker rm -f cpos-frontend 2>/dev/null || true

            # Port hali ham band bo'lsa, kim egallaganini ko'rsatamiz
            PORT=$(grep -sE '^APP_PORT=' .env | cut -d= -f2)
            PORT=${PORT:-3000}
            if ss -tln 2>/dev/null | grep -q ":${PORT} "; then
              echo "XATO: ${PORT}-port band. Uni quyidagi jarayon egallagan:"
              ss -tlnp 2>/dev/null | grep ":${PORT} " || true
              echo "Yechim: /opt/cpos-frontend/.env dagi APP_PORT ni bo'sh portga o'zgartiring."
              exit 1
            fi

            docker compose up -d

            # 'prune -f' faqat egasiz (dangling) image'larni o'chiradi —
            # ishlab turgan konteynerlarga tegmaydi.
            docker image prune -f || true

            # Nginx konfigi qo'lda sozlangan (proxy_pass -> 3000) va unga
            # bu yerdan tegilmaydi: root fayli uchun sudo kerak, script_stop
            # esa har qanday non-zero natijada deploy'ni to'xtatib qo'yadi.

            echo "=== Holat ==="
            docker compose ps || true

            # Backend'ga tegilmaganini tasdiqlaymiz (deploy uni to'xtatmasligi kerak).
            if docker ps -a --filter name=cpos-app -q | grep -q .; then
              if docker ps --filter name=cpos-app --filter status=running -q | grep -q .; then
                echo "OK: backend (cpos-app) ishlayapti."
              else
                echo "OGOHLANTIRISH: backend (cpos-app) ishlamayapti."
                echo "Bu deploy unga tegmadi — backend tomonda tekshiring."
              fi
            fi

            # Konteyner haqiqatan ishlayaptimi — deploy'ning yakuniy hukmi shu.
            sleep 3
            if docker ps --filter name=cpos-frontend --filter status=running -q | grep -q .; then
              echo "OK: cpos-frontend ishlayapti."
              exit 0
            else
              echo "XATO: konteyner ishlamayapti. Loglar:"
              docker logs --tail 50 cpos-frontend 2>&1 || true
              exit 1
            fi
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
          APP_PORT_TARGET: '3000'

      - name: Healthcheck
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            PORT=$(grep -sE '^APP_PORT=' /opt/cpos-frontend/.env | cut -d= -f2)
            PORT=${PORT:-3000}

            # 1) Konteynerning o'zi javob beryaptimi
            for i in $(seq 1 10); do
              if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
                echo "Konteyner ishlayapti (port ${PORT})."
                break
              fi
              if [ "$i" = "10" ]; then
                echo "Konteyner javob bermadi!"
                docker logs --tail 50 cpos-frontend
                exit 1
              fi
              echo "Kutilmoqda... ($i/10)"
              sleep 3
            done

            # 2) Domen orqali (host nginx + SSL) ochilyaptimi
            if curl -fsS --max-time 10 https://cpos.uz/healthz >/dev/null; then
              echo "Deploy muvaffaqiyatli: https://cpos.uz"
            else
              echo "OGOHLANTIRISH: konteyner ishlayapti, lekin https://cpos.uz javob bermadi."
              echo "domain-setup.sh ishga tushirilganini va DNS/SSL to'g'riligini tekshiring."
            fi
