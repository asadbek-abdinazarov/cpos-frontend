<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: #ffffff;
    position: relative;
  }

  /* ─── Fon: hero'dagi gradient orb'lar ─── */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .orb-1 {
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(0,123,255,0.22) 0%, transparent 70%);
    top: -220px; right: -140px;
  }
  .orb-2 {
    width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
    bottom: -180px; left: -120px;
  }
  .orb-3 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
    top: 180px; right: 320px;
  }

  /* Nozik to'r — saytdagi loader bilan bir xil */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,123,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,123,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  /* Chap tomondagi brend chizig'i */
  .edge {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background: linear-gradient(180deg, #007BFF 0%, #6366F1 55%, #06B6D4 100%);
  }

  /* ─── Kontent ─── */
  .wrap {
    position: relative;
    height: 100%;
    padding: 74px 80px 132px 94px;   /* pastda 150px xavfsiz zona */
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .mark {
    width: 72px;
    height: 67px;
    flex: none;
  }

  .brand-name {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #0b1220;
  }

  h1 {
    margin-top: 72px;
    font-size: 68px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -1.6px;
    color: #0b1220;
    max-width: 940px;
  }

  h1 .accent {
    background: linear-gradient(135deg, #007BFF 0%, #6366F1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .features {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 500;
    color: #475569;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #94a3b8;
    flex: none;
  }

  .url {
    margin-top: 40px;
    font-size: 27px;
    font-weight: 600;
    color: #007BFF;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="edge"></div>

  <div class="wrap">

          </linearGradient>
        </defs>
        <g transform="translate(250, 3800) scale(0.1, -0.1)">

      </svg>
      <span class="brand-name">CPOS</span>
    </div>

    <h1>Savdoni <span class="accent">avtomatlashtirish</span><br>va kassa dasturi</h1>

    <div class="features">
      <span>Ombor</span><span class="dot"></span>
      <span>Hisobotlar</span><span class="dot"></span>
      <span>Kassirlar</span><span class="dot"></span>
      <span>CRM</span>
    </div>

    <div class="url">cpos.uz</div>
  </div>
</body>
</html>
